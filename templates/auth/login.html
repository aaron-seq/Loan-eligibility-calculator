{% extends "base.html" %}
{% block title %}Sign in — LoanWise{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto">
  <h1 class="text-2xl font-bold text-slate-900">Sign in</h1>
  <p class="mt-2 text-sm text-slate-600">
    You do not need an account to check eligibility —
    <a href="{{ url_for('pages.apply_form') }}" class="text-indigo-600 underline">go straight to the form</a>.
    Signing in saves your applications so you can compare them.
  </p>

  <form method="post" action="{{ url_for('auth.login') }}"
        class="mt-6 bg-white rounded-lg border border-slate-200 p-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div>
      <label for="user_id" class="block text-sm font-medium text-slate-700">Username</label>
      <input id="user_id" name="user_id" required autocomplete="username"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
    </div>
    <div>
      <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
    </div>
    <button class="w-full py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700">
      Sign in
    </button>
  </form>

  <p class="mt-4 text-sm text-slate-600 text-center">
    No account?
    <a href="{{ url_for('pages.signup') }}" class="text-indigo-600 underline">Create one</a>
  </p>
</div>
{% endblock %}
