{% extends "base.html" %}
{% block title %}{{ code }} — LoanWise{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center py-16">
  <p class="text-5xl font-bold text-slate-300">{{ code }}</p>
  <h1 class="mt-4 text-xl font-semibold text-slate-900">{{ message }}</h1>
  <a href="{{ url_for('pages.home') }}"
     class="inline-block mt-6 px-5 py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700">
    Back to the start
  </a>
</div>
{% endblock %}
