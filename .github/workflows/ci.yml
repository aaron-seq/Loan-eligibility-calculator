name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published advisory against a pinned dependency is
    # found by CI rather than by an auditor. The pins are exact because the
    # model bundle is a pickle, which means they do not drift on their own.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  container:
    name: Container build and persistence smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build the production image (includes retraining)
        run: docker build -t loanwise:ci .

      - name: Start with a persistent volume and a non-default port
        run: |
          docker volume create loanwise-ci-data
          docker run -d --name loanwise-ci -p 8123:8123 \
            --health-interval=2s --health-start-period=5s \
            -e PORT=8123 -e SECRET_KEY=ci-only-session-key-at-least-32-characters \
            -v loanwise-ci-data:/data loanwise:ci

      - name: Check scoring, headers, non-root execution and container health
        run: |
          python scripts/smoke_http.py --base-url http://127.0.0.1:8123
          test "$(docker exec loanwise-ci id -u)" = "10001"
          docker exec loanwise-ci sh -c 'test -s data/train.csv && test ! -e data/test.csv && test -s LICENSE && test -s THIRD_PARTY_NOTICES.md'
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' loanwise-ci)" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          docker inspect loanwise-ci
          exit 1

      - name: Register a disposable account through HTTP
        run: |
          python - <<'PY'
          import json
          from scripts.smoke_http import request_json
          result, _ = request_json('http://127.0.0.1:8123', '/register', json.dumps({
              'user_id': 'ci_volume_test', 'email': 'ci-volume@example.com',
              'full_name': 'CI Volume Test', 'password': 'ci-disposable-password',
              'confirm_password': 'ci-disposable-password',
          }).encode())
          assert result['success'], result
          PY

      - name: Replace the container and verify the account survives
        run: |
          docker rm -f loanwise-ci
          docker run -d --name loanwise-ci -p 8123:8123 \
            -e PORT=8123 -e SECRET_KEY=ci-only-session-key-at-least-32-characters \
            -v loanwise-ci-data:/data loanwise:ci
          python scripts/smoke_http.py --base-url http://127.0.0.1:8123
          python - <<'PY'
          import json
          from scripts.smoke_http import request_json
          result, _ = request_json('http://127.0.0.1:8123', '/login', json.dumps({
              'user_id': 'ci_volume_test', 'password': 'ci-disposable-password',
          }).encode())
          assert result['success'], result
          PY

      - name: Container diagnostics
        if: always()
        run: docker logs loanwise-ci || true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor set by numpy 2.4, pandas 3.0 and scikit-learn 1.9,
        # all of which declare requires-python >=3.11.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check loanapp tests scripts app.py
          ruff format --check loanapp tests scripts app.py

      - name: Committed stylesheet matches the templates
        # Tailwind only emits classes it finds in templates/, so a class added
        # without rebuilding is silently unstyled. Rebuild and compare.
        if: matrix.python-version == '3.13'
        env:
          TAILWINDCSS_VERSION: v3.4.19
        run: |
          python -m pytailwindcss -i static/src/tailwind.css -o /tmp/app.css --content "./templates/**/*.html" --minify
          if ! diff -q /tmp/app.css static/css/app.css; then
            echo "static/css/app.css is stale. Run \`make css\` and commit the result."
            exit 1
          fi

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov=loanapp --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt -r requirements-dev.txt --strict

      - name: Static security scan
        run: bandit -r loanapp app.py -ll

  accessibility:
    # axe-core in real Chromium, against the real stylesheet. The audit guards
    # its own validity: if the stylesheet fails to load, test_styles_are_loaded
    # fails rather than letting every contrast check pass on unstyled HTML.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Audit
        # A11Y_REQUIRED turns "cannot run" into a failure. Without it a broken
        # browser install would skip every test and this job would pass green.
        env:
          A11Y_REQUIRED: "1"
        run: pytest -m a11y -rs

  train:
    # Training is the part most likely to break silently: it is the only thing
    # that proves the committed bundle still matches the contracts in the code,
    # and that the model card's numbers can be reproduced.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Train from scratch
        run: FLASK_ENV=development python -m loanapp.ml.train --model-dir /tmp/ci-models --no-docs

      - name: Assert the retrained model still satisfies the product invariants
        run: |
          python - <<'PY'
          import json, sys

          metrics = json.load(open("/tmp/ci-models/metrics.json"))
          failures = []

          # A model that scores a smaller loan worse cannot back the guidance
          # feature, whatever its AUC.
          if not metrics["served_model_monotonicity"]["monotonic"]:
              failures.append("served model is not monotonic in loan amount")

          # Grade the model that actually ships. The trainer only keeps the
          # calibrated variant when it improves the Brier score, so reading
          # holdout_calibrated unconditionally could pass a model that was
          # never served (or fail one that was).
          served = (
              "holdout_calibrated" if metrics["calibrated"] else "holdout_uncalibrated"
          )
          auc = metrics[served]["roc_auc"]
          if auc < 0.70:
              failures.append(f"served ({served}) ROC-AUC {auc} below the 0.70 floor")

          # Guards against a feature-set change landing without a retrain.
          from loanapp.features import FEATURE_COLUMNS
          if tuple(metrics["feature_columns"]) != FEATURE_COLUMNS:
              failures.append("metrics feature list disagrees with the code")

          if failures:
              print("\n".join(f"FAIL: {f}" for f in failures))
              sys.exit(1)
          print(f"OK - served={served} ROC-AUC={auc}, monotonic, contract matches")
          PY

      - name: Check the committed bundle is loadable and current
        # Covers both contracts: feature columns, and the scikit-learn/numpy
        # versions the bundle was pickled under. A bundle that fails either is
        # refused at startup, so catching it here keeps it out of main.
        run: |
          python - <<'PY'
          from loanapp.ml.registry import load_bundle, ModelUnavailable, ModelContractError
          try:
              bundle = load_bundle("models")
          except ModelUnavailable:
              raise SystemExit("No committed model bundle in models/")
          except ModelContractError as exc:
              raise SystemExit(f"Committed bundle is stale — run `make train`:\n{exc}")

          # Loading is necessary but not sufficient: prove it can actually score.
          import pandas as pd
          from loanapp.features import FEATURE_COLUMNS
          frame = pd.DataFrame([dict.fromkeys(FEATURE_COLUMNS, 1.0)], columns=list(FEATURE_COLUMNS))
          probability = bundle.pipeline.predict_proba(frame)[0][1]
          assert 0.0 <= probability <= 1.0, probability
          print(f"Committed bundle {bundle.version} loads and scores ({probability:.4f})")
          PY
