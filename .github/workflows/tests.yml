name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the deployment target; 3.13 catches dependency pins with no
        # wheels on a current interpreter, which is how numpy==1.24.3 went
        # unnoticed until `pip install -r requirements.txt` stopped working.
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Train model
        # Model artefacts are git-ignored, so CI rebuilds them from
        # data/train.csv. Without this the prediction tests skip themselves.
        run: python models/model_trainer.py

      - name: Run tests
        run: pytest
