[pytest]
; Pytest configuration

testpaths = tests
python_files = test_*.py
python_functions = test_*

; Output options
; Coverage targets app.py. It previously measured the src/ package, which never
; imported successfully, so the reported number was meaningless.
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-branch

; Coverage options
[coverage:run]
source = .
omit =
    tests/*
    models/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
