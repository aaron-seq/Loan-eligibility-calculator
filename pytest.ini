[pytest]
; Pytest configuration

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-branch

; Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    requires_model: Tests that require ML model

; Coverage options
[coverage:run]
source = src
omit = 
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
